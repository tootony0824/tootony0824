<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Zhou Liqiang — AI Application Builder</title>
  <desc id="desc">A dark blue and violet profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#17112C"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#818CF8" stroke-opacity=".10"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="55" r="210" fill="#3B82F6" opacity=".12"/>
  <circle cx="1120" cy="330" r="170" fill="#8B5CF6" opacity=".14"/>
  <rect x="70" y="64" width="180" height="34" rx="17" fill="#172554"/>
  <text x="160" y="87" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#93C5FD">HELLO, I BUILD</text>
  <text x="70" y="178" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="800" fill="#F9FAFB">ZHOU LIQIANG</text>
  <rect x="70" y="207" width="520" height="6" rx="3" fill="url(#accent)"/>
  <text x="70" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700" letter-spacing="4" fill="#A78BFA">AI APPLICATION BUILDER</text>
  <text x="70" y="310" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#CBD5E1">Turning practical problems into reliable, usable products.</text>
  <g transform="translate(930 128)">
    <rect width="180" height="108" rx="22" fill="#111827" stroke="#4338CA" stroke-width="2"/>
    <circle cx="52" cy="54" r="25" fill="#3B82F6" opacity=".18"/><path d="M41 55l8 8 16-20" fill="none" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="49" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#F9FAFB">IDEA</text><text x="88" y="70" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#A78BFA">→ PRODUCT</text>
  </g>
</svg>
