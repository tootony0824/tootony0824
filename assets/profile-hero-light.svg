<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Zhou Liqiang — AI Application Builder</title>
  <desc id="desc">A blue and violet profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6366F1" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="55" r="210" fill="#60A5FA" opacity=".10"/>
  <circle cx="1120" cy="330" r="170" fill="#8B5CF6" opacity=".12"/>
  <rect x="70" y="64" width="180" height="34" rx="17" fill="#DBEAFE"/>
  <text x="160" y="87" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#1D4ED8">HELLO, I BUILD</text>
  <text x="70" y="178" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="800" fill="#111827">ZHOU LIQIANG</text>
  <rect x="70" y="207" width="520" height="6" rx="3" fill="url(#accent)"/>
  <text x="70" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700" letter-spacing="4" fill="#4F46E5">AI APPLICATION BUILDER</text>
  <text x="70" y="310" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#4B5563">Turning practical problems into reliable, usable products.</text>
  <g transform="translate(930 128)">
    <rect width="180" height="108" rx="22" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
    <circle cx="52" cy="54" r="25" fill="#2563EB" opacity=".12"/><path d="M41 55l8 8 16-20" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="49" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#111827">IDEA</text><text x="88" y="70" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#7C3AED">→ PRODUCT</text>
  </g>
</svg>
